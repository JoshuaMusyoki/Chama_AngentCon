<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mpatanishi AI - Chama Arbitrator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { max-width: 800px; margin: 50px auto; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        #responseArea { white-space: pre-wrap; background: #e9f7ef; border-radius: 10px; padding: 20px; margin-top: 20px; display: none; border-left: 5px solid #28a745; }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #1a252f; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; display: none; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1 class="text-success">Mpatanishi AI</h1>
        <p class="text-muted">Objective Arbitration for Kenyan Chamas</p>
    </div>

    <div class="mb-3">
        <label for="disputeInput" class="form-label">Describe the Dispute (Sheng/English/Swahili)</label>
        <textarea class="form-control" id="disputeInput" rows="4" placeholder="e.g., Kamau alituma mchango tarehe 12 badala ya tarehe 5..."></textarea>
    </div>

    <button onclick="submitDispute()" class="btn btn-primary w-100 py-2" id="submitBtn">Resolve Dispute</button>

    <div id="loader" class="loader"></div>

    <div id="responseArea">
        <h5 class="text-success">Arbitration Verdict:</h5>
        <div id="verdictText"></div>
    </div>
</div>

<script>
    async function submitDispute() {
        const dispute = document.getElementById('disputeInput').value;
        if (!dispute) return alert("Please enter dispute details.");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('responseArea').style.display = 'none';
        document.getElementById('submitBtn').disabled = true;

        try {
            const response = await fetch('/api/arbitrate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dispute: dispute })
            });

            const data = await response.json();
            document.getElementById('verdictText').innerText = data.verdict;
            document.getElementById('responseArea').style.display = 'block';
        } catch (error) {
            alert("Error connecting to the AI engine.");
            console.error(error);
        } finally {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    }
</script>

</body>
</html>
