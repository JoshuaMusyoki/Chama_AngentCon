name: Deploy to Firebase Hosting and Cloud Run

on:
  push:
    branches:
      - main # or your default branch, e.g., master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: gcproadshow # Replace with your Google Cloud Project ID
      CLOUD_RUN_SERVICE_NAME: chama-agent-api
      CLOUD_RUN_REGION: us-central1
      FIREBASE_PUBLIC_DIR: src/main/resources/static

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Spring Boot application
        run: mvn clean package -DskipTests

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker

      - name: Build and Push Docker Image to Google Container Registry
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE_NAME }} .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAMA_AGENT_CON }}' # Replace with your Firebase service account secret name
          projectId: '${{ env.PROJECT_ID }}'
          channelId: live
          entryPoint: . # The root of your project where firebase.json is located
